<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ร้านค้าของชำ - ระบบขายหน้าร้าน</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3F6C34" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');
  :root {
    --cream: #FAF7F1; --paper: #FFFFFF; --ink: #2A2A22; --ink-muted: #7A7566;
    --green: #3F6C34; --green-dark: #2C4D24; --green-light: #E9EFE2;
    --amber: #C97A2E; --amber-light: #FBEEDF; --line: #E4DFD1; --danger: #B14539;
  }
  * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; margin: 0; padding: 0; }
  body { background: var(--cream); }
  .mono { font-family: 'JetBrains Mono', monospace; }
  button { cursor: pointer; font-family: 'Sarabun', sans-serif; }
  input { font-family: 'Sarabun', sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .prod-card:hover { border-color: var(--green); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useEffect, useMemo, useRef } = React;

const CURRENCY = (n) => "฿" + Number(n || 0).toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const CATEGORY_COLORS = [
  "#3F6C34", "#C97A2E", "#2B6CB0", "#D69E2E", "#805AD5",
  "#DD6B20", "#319795", "#E53E3E", "#D69E2E", "#4A5568"
];

function Icon({ path, size = 16, color = "currentColor" }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{path}</svg>;
}
const IconSearch = (p) => <Icon {...p} path={<><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></>} />;
const IconPlus = (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></>} />;
const IconMinus = (p) => <Icon {...p} path={<line x1="5" y1="12" x2="19" y2="12" />} />;
const IconTrash = (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /><path d="M10 11v6M14 11v6" /></>} />;
const IconX = (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>} />;
const IconPencil = (p) => <Icon {...p} path={<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />} />;
const IconAlert = (p) => <Icon {...p} path={<><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></>} />;
const IconImage = (p) => <Icon {...p} path={<><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></>} />;

const SEED_PRODUCTS = [
  { id: "p1", name: "ข้าวสารหอมมะลิ 5 กก.", price: 145, cost: 120, stock: 20, unit: "ถุง", barcode: "8850001000015", category: "ข้าวของแห้ง", image: "" },
  { id: "p2", name: "น้ำปลาตราปลาหมึก", price: 22, cost: 16, stock: 30, unit: "ขวด", barcode: "8850002000022", category: "เครื่องปรุง", image: "" },
  { id: "p3", name: "ไข่ไก่เบอร์ 2", price: 4.5, cost: 3.5, stock: 120, unit: "ฟอง", barcode: "8850003000039", category: "สด", image: "" },
  { id: "p4", name: "น้ำมันพืชตราองุ่น 1 ล.", price: 58, cost: 48, stock: 15, unit: "ขวด", barcode: "8850004000046", category: "เครื่องปรุง", image: "" },
  { id: "p5", name: "มาม่าต้มยำกุ้ง", price: 6, cost: 4.5, stock: 100, unit: "ซอง", barcode: "8850005000053", category: "ข้าวของแห้ง", image: "" },
  { id: "p6", name: "น้ำดื่มสิงห์ 600 มล.", price: 7, cost: 5, stock: 48, unit: "ขวด", barcode: "8850006000060", category: "เครื่องดื่ม", image: "" },
];

function uid(prefix) { return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function formatDateTime(ts) { return new Date(ts).toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" }); }
function isSameDay(ts, ref) {
  const a = new Date(ts), b = new Date(ref);
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function loadLocal(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}
function saveLocal(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

function App() {
  const [tab, setTab] = useState("sell");
  const [products, setProducts] = useState(() => loadLocal("pos_products", SEED_PRODUCTS));
  const [sales, setSales] = useState(() => loadLocal("pos_sales", []));
  const [cart, setCart] = useState([]);
  const [query, setQuery] = useState("");
  const [checkoutOpen, setCheckoutOpen] = useState(false);
  const [cashInput, setCashInput] = useState("");
  const [customerName, setCustomerName] = useState("");
  const [lastReceipt, setLastReceipt] = useState(null);
  const [productModal, setProductModal] = useState(null);
  const [historyDetail, setHistoryDetail] = useState(null);
  const [toast, setToast] = useState(null);

  useEffect(() => { saveLocal("pos_products", products); }, [products]);
  useEffect(() => { saveLocal("pos_sales", sales); }, [sales]);

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(null), 2000); }

  const filteredProducts = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return products;
    return products.filter((p) => p.name.toLowerCase().includes(q) || (p.barcode && p.barcode.includes(q)) || (p.category && p.category.toLowerCase().includes(q)));
  }, [products, query]);

  const cartTotal = useMemo(() => cart.reduce((sum, i) => sum + i.price * i.qty, 0), [cart]);
  const cartCount = useMemo(() => cart.reduce((sum, i) => sum + i.qty, 0), [cart]);

  function addToCart(product) {
    if (product.stock <= 0) return showToast("สินค้าหมด: " + product.name);
    setCart((prev) => {
      const existing = prev.find((i) => i.id === product.id);
      if (existing) {
        if (existing.qty >= product.stock) { showToast("สต๊อกไม่พอ: " + product.name); return prev; }
        return prev.map((i) => (i.id === product.id ? { ...i, qty: i.qty + 1 } : i));
      }
      return [...prev, { id: product.id, name: product.name, price: product.price, cost: product.cost || 0, unit: product.unit, category: product.category || "อื่นๆ", image: product.image || "", qty: 1 }];
    });
  }

  function changeQty(id, delta) {
    setCart((prev) => {
      const product = products.find((p) => p.id === id);
      return prev.map((i) => {
        if (i.id !== id) return i;
        const nextQty = i.qty + delta;
        if (product && nextQty > product.stock) { showToast("สต๊อกไม่พอ: " + i.name); return i; }
        return { ...i, qty: nextQty };
      }).filter((i) => i.qty > 0);
    });
  }

  function removeFromCart(id) { setCart((prev) => prev.filter((i) => i.id !== id)); }
  function clearCart() { setCart([]); }

  function handleScanEnter(e) {
    if (e.key !== "Enter") return;
    const q = query.trim();
    if (!q) return;
    const exact = products.find((p) => p.barcode === q);
    if (exact) { addToCart(exact); setQuery(""); }
  }

  function openCheckout() { if (cart.length === 0) return; setCashInput(""); setCustomerName(""); setCheckoutOpen(true); }

  function confirmCheckout() {
    const cash = parseFloat(cashInput);
    if (isNaN(cash) || cash < cartTotal) return showToast("จำนวนเงินไม่พอ");
    const sale = {
      id: uid("s"), timestamp: Date.now(), customerName: customerName.trim(),
      items: cart.map((i) => ({ id: i.id, name: i.name, price: i.price, cost: i.cost || 0, qty: i.qty, unit: i.unit, category: i.category || "อื่นๆ" })),
      total: cartTotal, profit: cart.reduce((sum, i) => sum + (i.price - (i.cost || 0)) * i.qty, 0),
      cash, change: cash - cartTotal,
    };
    setProducts((prev) => prev.map((p) => {
      const item = cart.find((i) => i.id === p.id);
      return item ? { ...p, stock: p.stock - item.qty } : p;
    }));
    setSales((prev) => [sale, ...prev]);
    setLastReceipt(sale);
    setCart([]);
    setCheckoutOpen(false);
    showToast("ชำระเงินเรียบร้อย");
  }

  function saveProduct(data) {
    if (productModal.mode === "add") {
      setProducts((prev) => [...prev, { ...data, id: uid("p") }]);
      showToast("เพิ่มสินค้าแล้ว");
    } else {
      setProducts((prev) => prev.map((p) => (p.id === data.id ? data : p)));
      showToast("บันทึกการแก้ไขแล้ว");
    }
    setProductModal(null);
  }

  function deleteProduct(id) {
    setProducts((prev) => prev.filter((p) => p.id !== id));
    setProductModal(null);
    showToast("ลบสินค้าแล้ว");
  }

  const today = Date.now();
  const todaysSales = sales.filter((s) => isSameDay(s.timestamp, today));
  const todaysTotal = todaysSales.reduce((sum, s) => sum + s.total, 0);
  const todaysProfit = todaysSales.reduce((sum, s) => sum + (s.profit || 0), 0);

  return (
    <div style={styles.app}>
      <header style={styles.header}>
        <div style={styles.headerLeft}>
          <div style={styles.logoMark}>ร้าน</div>
          <div>
            <div style={{ fontWeight: 600, fontSize: 17, color: "var(--ink)" }}>ร้านค้าของชำ</div>
            <div style={{ fontSize: 12, color: "var(--ink-muted)" }}>ระบบขายหน้าร้าน</div>
          </div>
        </div>
        <nav style={styles.tabs}>
          <TabButton active={tab === "sell"} onClick={() => setTab("sell")} label="ขายสินค้า" />
          <TabButton active={tab === "products"} onClick={() => setTab("products")} label="คลังสินค้า" />
          <TabButton active={tab === "history"} onClick={() => setTab("history")} label="ประวัติการขาย" />
          <TabButton active={tab === "customers"} onClick={() => setTab("customers")} label="ลูกค้า" />
        </nav>
      </header>

      {tab === "sell" && (
        <div style={styles.sellLayout}>
          <div style={styles.sellMain}>
            <div style={styles.searchRow}>
              <IconSearch size={18} color="var(--ink-muted)" />
              <input value={query} onChange={(e) => setQuery(e.target.value)} onKeyDown={handleScanEnter}
                placeholder="ค้นหาชื่อสินค้า หรือสแกน/พิมพ์บาร์โค้ดแล้วกด Enter" style={styles.searchInput} />
              {query && <button onClick={() => setQuery("")} style={styles.iconBtn} aria-label="ล้างคำค้นหา"><IconX size={16} /></button>}
            </div>
            <div style={styles.productGrid}>
              {filteredProducts.length === 0 && <p style={{ color: "var(--ink-muted)", fontSize: 14, padding: "24px 4px" }}>ไม่พบสินค้าที่ค้นหา</p>}
              {filteredProducts.map((p) => (
                <button key={p.id} className="prod-card" onClick={() => addToCart(p)} disabled={p.stock <= 0}
                  style={{ ...styles.productCard, opacity: p.stock <= 0 ? 0.45 : 1 }}>
                  <div style={styles.cardImgWrap}>
                    {p.image ? (
                      <img src={p.image} alt={p.name} style={styles.cardImg} />
                    ) : (
                      <div style={styles.cardImgPlaceholder}><IconImage size={28} color="var(--ink-muted)" /></div>
                    )}
                  </div>
                  <div style={{ fontSize: 14, fontWeight: 500, color: "var(--ink)", lineHeight: 1.35, textAlign: "left", marginTop: 8 }}>{p.name}</div>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginTop: 6 }}>
                    <span className="mono" style={{ fontSize: 15, fontWeight: 600, color: "var(--green-dark)" }}>{CURRENCY(p.price)}</span>
                    <span style={{ fontSize: 11, color: p.stock <= 5 ? "var(--danger)" : "var(--ink-muted)" }}>{p.stock <= 0 ? "หมด" : "คงเหลือ " + p.stock + " " + p.unit}</span>
                  </div>
                </button>
              ))}
            </div>
          </div>

          <aside style={styles.cartPanel}>
            <div style={styles.receiptHead}>
              <span style={{ fontWeight: 600, fontSize: 15 }}>รายการขาย</span>
              {cart.length > 0 && <button onClick={clearCart} style={styles.linkBtn}>ล้างตะกร้า</button>}
            </div>
            <div style={styles.cartItems}>
              {cart.length === 0 && <div style={{ padding: "32px 8px", textAlign: "center", color: "var(--ink-muted)", fontSize: 13 }}>แตะสินค้าทางซ้ายเพื่อเพิ่มลงตะกร้า</div>}
              {cart.map((item) => (
                <div key={item.id} style={styles.cartRow}>
                  {item.image ? (
                    <img src={item.image} alt="" style={{ width: 36, height: 36, borderRadius: 6, objectFit: "cover" }} />
                  ) : (
                    <div style={{ width: 36, height: 36, borderRadius: 6, background: "var(--line)", display: "flex", alignItems: "center", justifyContent: "center" }}><IconImage size={16} color="var(--ink-muted)" /></div>
                  )}
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13.5, color: "var(--ink)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.name}</div>
                    <div className="mono" style={{ fontSize: 12, color: "var(--ink-muted)" }}>{CURRENCY(item.price)} × {item.qty}</div>
                  </div>
                  <div style={styles.qtyControls}>
                    <button onClick={() => changeQty(item.id, -1)} style={styles.qtyBtn} aria-label="ลดจำนวน"><IconMinus size={13} /></button>
                    <span className="mono" style={{ fontSize: 13, minWidth: 18, textAlign: "center" }}>{item.qty}</span>
                    <button onClick={() => changeQty(item.id, 1)} style={styles.qtyBtn} aria-label="เพิ่มจำนวน"><IconPlus size={13} /></button>
                  </div>
                  <button onClick={() => removeFromCart(item.id)} style={styles.iconBtn} aria-label="ลบรายการ"><IconTrash size={14} color="var(--danger)" /></button>
                </div>
              ))}
            </div>
            <div style={styles.receiptFoot}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                <span style={{ fontSize: 13, color: "var(--ink-muted)" }}>จำนวนชิ้น</span>
                <span className="mono" style={{ fontSize: 13 }}>{cartCount}</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}>
                <span style={{ fontSize: 16, fontWeight: 600 }}>ยอดรวม</span>
                <span className="mono" style={{ fontSize: 22, fontWeight: 600, color: "var(--green-dark)" }}>{CURRENCY(cartTotal)}</span>
              </div>
              <button onClick={openCheckout} disabled={cart.length === 0} style={{ ...styles.primaryBtn, opacity: cart.length === 0 ? 0.5 : 1 }}>รับชำระเงิน</button>
            </div>
          </aside>
        </div>
      )}

      {tab === "products" && <ProductsView products={products}
        onAdd={() => setProductModal({ mode: "add", data: { name: "", price: "", cost: "", stock: "", unit: "", barcode: "", category: "", image: "" } })}
        onEdit={(p) => setProductModal({ mode: "edit", data: p })} />}

      {tab === "history" && <HistoryView sales={sales} todaysSales={todaysSales} todaysTotal={todaysTotal} todaysProfit={todaysProfit} onSelect={setHistoryDetail} />}

      {tab === "customers" && <CustomersView sales={sales} />}

      {checkoutOpen && (
        <Modal onClose={() => setCheckoutOpen(false)} title="รับชำระเงิน">
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 18 }}>
            <span style={{ fontSize: 15, color: "var(--ink-muted)" }}>ยอดที่ต้องชำระ</span>
            <span className="mono" style={{ fontSize: 24, fontWeight: 600, color: "var(--green-dark)" }}>{CURRENCY(cartTotal)}</span>
          </div>
          <label style={styles.fieldLabel}>ชื่อลูกค้า (ไม่บังคับ)</label>
          <input value={customerName} onChange={(e) => setCustomerName(e.target.value)} placeholder="เช่น คุณสมชาย หรือเว้นว่างไว้" style={styles.modalInput} />
          <label style={styles.fieldLabel}>รับเงินสดมา (บาท)</label>
          <input autoFocus type="number" value={cashInput} onChange={(e) => setCashInput(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && confirmCheckout()} placeholder="0.00" style={styles.modalInput} />
          <div style={styles.quickCash}>
            {[cartTotal, Math.ceil(cartTotal / 20) * 20, Math.ceil(cartTotal / 100) * 100, Math.ceil(cartTotal / 500) * 500]
              .filter((v, i, arr) => v > 0 && arr.indexOf(v) === i).slice(0, 4)
              .map((v) => <button key={v} onClick={() => setCashInput(String(v))} style={styles.chip}>{CURRENCY(v)}</button>)}
          </div>
          {cashInput && !isNaN(parseFloat(cashInput)) && (
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 16, paddingTop: 16, borderTop: "0.5px dashed var(--line)" }}>
              <span style={{ fontSize: 14, color: "var(--ink-muted)" }}>เงินทอน</span>
              <span className="mono" style={{ fontSize: 18, fontWeight: 600, color: parseFloat(cashInput) < cartTotal ? "var(--danger)" : "var(--ink)" }}>
                {parseFloat(cashInput) >= cartTotal ? CURRENCY(parseFloat(cashInput) - cartTotal) : "ไม่พอ"}
              </span>
            </div>
          )}
          <button onClick={confirmCheckout} style={{ ...styles.primaryBtn, marginTop: 20 }}>ยืนยันการชำระเงิน</button>
        </Modal>
      )}

      {lastReceipt && (
        <Modal onClose={() => setLastReceipt(null)} title="ใบเสร็จ">
          <ReceiptView sale={lastReceipt} />
          <button onClick={() => setLastReceipt(null)} style={{ ...styles.primaryBtn, marginTop: 16 }}>เสร็จสิ้น</button>
        </Modal>
      )}

      {historyDetail && (
        <Modal onClose={() => setHistoryDetail(null)} title="รายละเอียดใบเสร็จ">
          <ReceiptView sale={historyDetail} />
          <button onClick={() => setHistoryDetail(null)} style={{ ...styles.primaryBtn, marginTop: 16 }}>ปิด</button>
        </Modal>
      )}

      {productModal && <ProductModal modal={productModal} onClose={() => setProductModal(null)} onSave={saveProduct} onDelete={deleteProduct} />}
      {toast && <div style={styles.toast}>{toast}</div>}
    </div>
  );
}

function TabButton({ active, onClick, label }) {
  return (
    <button onClick={onClick} style={{ padding: "8px 14px", borderRadius: 8, border: "none",
      background: active ? "var(--green)" : "transparent", color: active ? "#fff" : "var(--ink-muted)", fontSize: 13.5, fontWeight: 500 }}>
      {label}
    </button>
  );
}

function ProductsView({ products, onAdd, onEdit }) {
  const [q, setQ] = useState("");
  const filtered = products.filter((p) => p.name.toLowerCase().includes(q.toLowerCase()));
  return (
    <div style={{ padding: "20px 28px 40px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, gap: 12 }}>
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="ค้นหาสินค้าในคลัง"
          style={{ ...styles.searchInput, background: "var(--paper)", border: "0.5px solid var(--line)", borderRadius: 8, padding: "9px 14px", maxWidth: 320 }} />
        <button onClick={onAdd} style={styles.addBtn}><IconPlus size={16} /> เพิ่มสินค้า</button>
      </div>
      <div style={styles.tableWrap}>
        <table style={styles.table}>
          <thead><tr>
            <th style={styles.th}>รูปภาพ</th>
            <th style={styles.th}>สินค้า</th><th style={styles.th}>หมวดหมู่</th>
            <th style={{ ...styles.th, textAlign: "right" }}>ต้นทุน</th>
            <th style={{ ...styles.th, textAlign: "right" }}>ราคา</th><th style={{ ...styles.th, textAlign: "right" }}>คงเหลือ</th>
            <th style={styles.th}>บาร์โค้ด</th><th style={styles.th}></th>
          </tr></thead>
          <tbody>
            {filtered.map((p) => (
              <tr key={p.id}>
                <td style={{ ...styles.td, width: 50 }}>
                  {p.image ? (
                    <img src={p.image} alt="" style={{ width: 40, height: 40, borderRadius: 6, objectFit: "cover" }} />
                  ) : (
                    <div style={{ width: 40, height: 40, borderRadius: 6, background: "var(--line)", display: "flex", alignItems: "center", justifyContent: "center" }}><IconImage size={18} color="var(--ink-muted)" /></div>
                  )}
                </td>
                <td style={styles.td}>{p.name}</td>

function CategoryPieChart({ sales }) {
  const categoryMap = {};
  let totalRevenue = 0;

  sales.forEach((s) => {
    s.items.forEach((it) => {
      const cat = it.category || "อื่นๆ";
      const revenue = (it.price || 0) * (it.qty || 0);
      categoryMap[cat] = (categoryMap[cat] || 0) + revenue;
      totalRevenue += revenue;
    });
  });

  const categories = Object.keys(categoryMap).map((cat, idx) => {
    const value = categoryMap[cat];
    const percent = totalRevenue > 0 ? (value / totalRevenue) * 100 : 0;
    return { name: cat, value, percent, color: CATEGORY_COLORS[idx % CATEGORY_COLORS.length] };
  }).sort((a, b) => b.value - a.value);

  if (totalRevenue === 0 || categories.length === 0) {
    return <div style={{ textAlign: "center", color: "var(--ink-muted)", fontSize: 13, padding: "20px 0" }}>ไม่มีข้อมูลการขายในเดือนนี้</div>;
  }

  let accumulatedPercent = 0;
  const slices = categories.map((cat) => {
    const startAngle = (accumulatedPercent / 100) * 360;
    accumulatedPercent += cat.percent;
    const endAngle = (accumulatedPercent / 100) * 360;
    return { ...cat, startAngle, endAngle };
  });

  function getCoordinates(angle) {
    const rad = ((angle - 90) * Math.PI) / 180;
    return { x: 100 + 80 * Math.cos(rad), y: 100 + 80 * Math.sin(rad) };
  }

  return (
    <div style={styles.chartContainer}>
      <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 16 }}>สัดส่วนยอดขายตามหมวดหมู่ (%)</div>
      <div style={{ display: "flex", alignItems: "center", gap: 24, flexWrap: "wrap" }}>
        <svg width="180" height="180" viewBox="0 0 200 200" style={{ transform: "rotate(0deg)", flexShrink: 0 }}>
          {slices.map((slice, i) => {
            if (slice.percent >= 99.99) {
              return <circle key={i} cx="100" cy="100" r="80" fill="none" stroke={slice.color} strokeWidth="36" />;
            }
            const start = getCoordinates(slice.startAngle);
            const end = getCoordinates(slice.endAngle);
            const largeArcFlag = slice.endAngle - slice.startAngle > 180 ? 1 : 0;
            const pathData = `M ${start.x} ${start.y} A 80 80 0 ${largeArcFlag} 1 ${end.x} ${end.y}`;
            return (
              <path key={i} d={pathData} fill="none" stroke={slice.color} strokeWidth="36" />
            );
          })}
        </svg>

        <div style={{ flex: 1, minWidth: 180 }}>
          {categories.map((c) => (
            <div key={c.name} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8, fontSize: 13 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ width: 12, height: 12, borderRadius: 3, background: c.color, display: "inline-block" }}></span>
                <span>{c.name}</span>
              </div>
              <div className="mono" style={{ fontWeight: 600 }}>{c.percent.toFixed(1)}%</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ProductModal({ modal, onClose, onSave, onDelete }) {
  const [form, setForm] = useState(modal.data);
  const [error, setError] = useState("");
  const fileInputRef = useRef(null);
  const isEdit = modal.mode === "edit";

  function set(field, value) { setForm((f) => ({ ...f, [field]: value })); }

  function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) return setError("ขนาดไฟล์รูปภาพห้ามเกิน 2MB");

    const reader = new FileReader();
    reader.onload = (evt) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const maxDim = 300;
        let w = img.width, h = img.height;
        if (w > h) { if (w > maxDim) { h *= maxDim / w; w = maxDim; } }
        else { if (h > maxDim) { w *= maxDim / h; h = maxDim; } }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        const compressedBase64 = canvas.toDataURL("image/jpeg", 0.7);
        set("image", compressedBase64);
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  }

  function handleSave() {
    if (!form.name || !form.name.trim()) return setError("กรุณาระบุชื่อสินค้า");
    const price = parseFloat(form.price);
    if (isNaN(price) || price < 0) return setError("ราคาสินค้าไม่ถูกต้อง");
    const cost = form.cost === "" || form.cost === undefined ? 0 : parseFloat(form.cost);
    if (isNaN(cost) || cost < 0) return setError("ต้นทุนไม่ถูกต้อง");
    const stock = parseInt(form.stock, 10);
    if (isNaN(stock) || stock < 0) return setError("จำนวนคงเหลือไม่ถูกต้อง");
    setError("");
    onSave({ ...form, price, cost, stock, name: form.name.trim() });
  }

  return (
    <Modal onClose={onClose} title={isEdit ? "แก้ไขสินค้า" : "เพิ่มสินค้าใหม่"}>
      <label style={styles.fieldLabel}>รูปภาพสินค้า</label>
      <div style={{ display: "flex", gap: 12, alignItems: "center", marginBottom: 10 }}>
        {form.image ? (
          <div style={{ position: "relative" }}>
            <img src={form.image} alt="" style={{ width: 72, height: 72, borderRadius: 8, objectFit: "cover", border: "1px solid var(--line)" }} />
            <button onClick={() => set("image", "")} style={{ position: "absolute", top: -6, right: -6, background: "var(--danger)", color: "#fff", border: "none", borderRadius: "50%", width: 20, height: 20, display: "flex", alignItems: "center", justifyContent: "center" }}><IconX size={12} /></button>
          </div>
        ) : (
          <div onClick={() => fileInputRef.current.click()} style={{ width: 72, height: 72, borderRadius: 8, border: "1px dashed var(--ink-muted)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", cursor: "pointer", background: "var(--cream)" }}>
            <IconImage size={24} color="var(--ink-muted)" />
            <span style={{ fontSize: 10, color: "var(--ink-muted)", marginTop: 2 }}>เพิ่มรูป</span>
          </div>
        )}
        <input ref={fileInputRef} type="file" accept="image/*" onChange={handleImageUpload} style={{ display: "none" }} />
        <button type="button" onClick={() => fileInputRef.current.click()} style={{ border: "1px solid var(--line)", background: "#fff", padding: "8px 12px", borderRadius: 6, fontSize: 12 }}>
          {form.image ? "เปลี่ยนรูป" : "เลือกรูปภาพ..."}
        </button>
      </div>

      <label style={styles.fieldLabel}>ชื่อสินค้า</label>
      <input style={styles.modalInput} value={form.name} onChange={(e) => set("name", e.target.value)} placeholder="เช่น ข้าวสารหอมมะลิ 5 กก." />
      <div style={{ display: "flex", gap: 12 }}>
        <div style={{ flex: 1 }}><label style={styles.fieldLabel}>ราคาขาย (บาท)</label><input type="number" style={styles.modalInput} value={form.price} onChange={(e) => set("price", e.target.value)} placeholder="0.00" /></div>
        <div style={{ flex: 1 }}><label style={styles.fieldLabel}>ต้นทุน (บาท)</label><input type="number" style={styles.modalInput} value={form.cost} onChange={(e) => set("cost", e.target.value)} placeholder="0.00" /></div>
      </div>
      <div style={{ display: "flex", gap: 12 }}>
        <div style={{ flex: 1 }}><label style={styles.fieldLabel}>จำนวนคงเหลือ</label><input type="number" style={styles.modalInput} value={form.stock} onChange={(e) => set("stock", e.target.value)} placeholder="0" /></div>
        <div style={{ flex: 1 }}><label style={styles.fieldLabel}>หน่วยนับ</label><input style={styles.modalInput} value={form.unit} onChange={(e) => set("unit", e.target.value)} placeholder="ชิ้น, ถุง, ขวด..." /></div>
      </div>
      <div style={{ display: "flex", gap: 12 }}>
        <div style={{ flex: 1 }}><label style={styles.fieldLabel}>หมวดหมู่</label><input style={styles.modalInput} value={form.category} onChange={(e) => set("category", e.target.value)} placeholder="เช่น เครื่องปรุง" /></div>
      </div>
      <label style={styles.fieldLabel}>บาร์โค้ด (ถ้ามี)</label>
      <input style={styles.modalInput} value={form.barcode} onChange={(e) => set("barcode", e.target.value)} placeholder="สแกนหรือพิมพ์รหัส" />
      {error && <p style={{ color: "var(--danger)", fontSize: 13, marginTop: -6, marginBottom: 10 }}>{error}</p>}
      <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
        {isEdit && <button onClick={() => onDelete(form.id)} style={styles.dangerBtn}>ลบสินค้า</button>}
        <button onClick={handleSave} style={{ ...styles.primaryBtn, flex: 1 }}>บันทึก</button>
      </div>
    </Modal>
  );
}
